name: LoanFlow Backend CI

on:
  push:
    branches:
      - main
      - 'development/**'
    paths:
      - 'backend/loanflow-parent/**'
      - 'backend/loanflow-common/**'
      - 'backend/loan-service/**'
      - 'backend/gateway-service/**'

  pull_request:
    branches:
      - main
      - 'development/**'
    paths:
      - 'backend/loanflow-parent/**'
      - 'backend/loanflow-common/**'
      - 'backend/loan-service/**'
      - 'backend/gateway-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test LoanFlow backend
        working-directory: backend/loanflow-parent
        run: mvn clean verify

      - name: Upload Surefire test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            backend/**/target/surefire-reports/**
          if-no-files-found: warn